name: CI — Build & Test

on:
  push:
    branches: [ "main", "week9/sprint4-testing" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build and Test (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore
        working-directory: Cardiac-Monitoring-System

      - name: Build
        run: dotnet build --no-restore --configuration Release
        working-directory: Cardiac-Monitoring-System

      # Tests use SQLite in-memory + AddDistributedMemoryCache —
      # no SQL Server or Redis required in CI.
      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal
        working-directory: Cardiac-Monitoring-System
